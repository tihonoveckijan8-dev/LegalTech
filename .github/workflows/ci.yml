name: LegalFlow checks

on:
  push:
    branches:
      - main
      - feature/legalflow-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # WHY: npm 10's Arborist can crash while resolving Vite 8's optional
      # peer-dependency graph (npm/cli #9787). Pin npm 11 for deterministic CI.
      - name: Set up npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Save generated dependency lockfile
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: legalflow-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
