name: LegalFlow checks

on:
  push:
    branches:
      - main
      - feature/legalflow-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # WHY: npm 10's Arborist can crash while resolving Vite 8's optional
      # peer-dependency graph (npm/cli #9787). Pin npm 11 for deterministic CI.
      - name: Set up npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
