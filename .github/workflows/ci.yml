name: LegalFlow checks

on:
  push:
    branches:
      - main
      - feature/legalflow-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # WHY: Commit the generated lockfile once so future CI runs use the exact
      # dependency graph. This runs only on pushes to the development branch.
      - name: Commit initial lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/legalflow-mvp'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add npm lockfile"
            git push
          fi
