name: LegalFlow checks

on:
  push:
    branches:
      - main
      - feature/legalflow-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # WHY: npm 10's Arborist can crash while resolving this dependency graph.
      # Node 24 is paired with a pinned npm 11 release for repeatable installs.
      - name: Set up npm
        run: npm install --global npm@11.18.0

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build


  database:
    name: Local Supabase migrations and security tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      # WHY: migrations must replay against a clean local Supabase stack before
      # any frontend deploy can be considered ready.
      - name: Start local Supabase stack
        run: supabase start

      - name: Reapply every migration from a clean database
        run: supabase db reset --local

      - name: Run database security tests
        run: supabase test db

      - name: Lint database functions
        run: supabase db lint --local --level error

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
