name: LegalFlow checks

on:
  push:
    branches:
      - main
      - feature/legalflow-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # WHY: npm 10's Arborist can crash while resolving this dependency graph.
      # Node 24 is paired with a pinned npm 11 release for repeatable installs.
      - name: Set up npm
        run: npm install --global npm@11.18.0

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
